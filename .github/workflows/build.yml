name: Build V3600GS Connect
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Verify installed dependencies
        run: |
          python -m pip check
          python -c "from PIL import Image; print('Pillow OK:', Image.__version__)"
      - name: Compile and test
        run: |
          python -m compileall -q main.py onu_parser.py excel_record.py session_runner.py continuous_ping.py ping_judgement.py ping_mapping.py rebuild_excel.py production_info.py tests
          python -m unittest discover -s tests -v
      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name V3600GS_Connect_V1.0.23.1 --icon CT.ico --add-data "CT.ico;." main.py
      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path dist/V3600GS_Connect_V1.0.23.1.exe)) { throw 'EXE missing' }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: V3600GS_Connect_V1.0.23.1
          path: dist/V3600GS_Connect_V1.0.23.1.exe
          if-no-files-found: error
