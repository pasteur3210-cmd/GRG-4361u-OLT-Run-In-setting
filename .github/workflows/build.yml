name: Build V3600GS Connect
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Compile and test
        run: |
          python -m compileall -q main.py tests
          python -m unittest discover -s tests -v
      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name V3600GS_Connect_V1.0.8 main.py
      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path dist/V3600GS_Connect_V1.0.8.exe)) { throw 'EXE missing' }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: V3600GS_Connect_V1.0.8
          path: dist/V3600GS_Connect_V1.0.8.exe
          if-no-files-found: error
